<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ICT Service Request System</title>

   <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="header">

        <div>
            <h1>ICT Service Request</h1>
            <p>Service Request Management System</p>
        </div>

        <button id="logoutBtn" class="btn-danger">
            Logout
        </button>

    </header>


    <main class="container">


        <!-- ============================================
             REQUEST FORM
        ============================================ -->

        <section id="createRequestSection" class="card">

            <h2>Create Service Request</h2>

            <div class="section-actions request-filters">
                <input
                    id="requestSearch"
                    class="request-search"
                    type="search"
                    placeholder="Search requester name..."
                    aria-label="Search requester name"
                >

                <select id="requesterFilter" class="requester-filter" aria-label="Filter by requester">
                    <option value="">All requesters</option>
                </select>
            </div>

            <form id="requestForm">

                <div class="form-group">

                    <label for="requesterName">
                        Requester Name
                    </label>

                    <input
                        type="text"
                        id="requesterName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Hardware">
                            Hardware
                        </option>

                        <option value="Software">
                            Software
                        </option>

                        <option value="Network">
                            Network
                        </option>

                        <option value="Account">
                            Account
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe your problem..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="">
                            Select priority
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Urgent">
                            Urgent
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                    id="submitRequestBtn"
                >
                    Submit Request
                </button>

            </form>

            <p id="requestMessage"></p>

        </section>


        <!-- ============================================
             REQUEST LIST
        ============================================ -->

        <section id="serviceRequestsSection" class="card hidden">

            <div class="section-header">

                <h2>Service Requests</h2>

                <div class="section-actions">
                    <button
                        id="refreshBtn"
                        class="btn-secondary"
                        type="button"
                    >
                        Refresh
                    </button>
                </div>

            </div>


            <div id="requestList">

                <p>Loading requests...</p>

            </div>

        </section>

    </main>


    <!-- Supabase Library -->

   <!-- 1. Supabase JS Client (gikan sa CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Imong Supabase Configuration -->
<script src="./js/supabase.js"></script>

<!-- 3. Imong Custom Logic -->
<script src="./js/auth.js"></script>
<script src="./js/app.js"></script>
</body>

</html>
